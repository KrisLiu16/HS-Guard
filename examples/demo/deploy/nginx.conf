# Include in nginx's http context. TLS is terminated by the ingress in front of this listener.
limit_req_zone $binary_remote_addr zone=guard_requests:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=guard_connections:10m;
server {
    listen 8081;
    server_tokens off;
    client_max_body_size 4m;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    limit_conn guard_connections 20;
    limit_req zone=guard_requests burst=20 nodelay;
    location / {
        proxy_pass http://hs-guard:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_read_timeout 45s;
        proxy_send_timeout 30s;
    }
}
